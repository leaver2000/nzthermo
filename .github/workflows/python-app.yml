name: Python application

on:
  push:
    branches: ["master", "development"]
  pull_request:
    branches: ["master", "development"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        numpy: ["numpy>=2"]
        include:
          - python-version: "3.11"
            numpy: "numpy<2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools_scm needs history for the version
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.dev.txt "${{ matrix.numpy }}"
      - name: Lint
        run: ruff check . --exit-zero
      - name: Build extensions
        run: python setup.py build_ext --inplace
      - name: Test
        run: pytest -q

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.dev.txt coverage
      - run: python setup.py build_ext --inplace --coverage
      - run: |
          coverage run -m pytest -q
          coverage report -m

  sdist-install:
    # the install path from #26: an isolated pip build with whatever Cython is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install .
          cd /tmp && python -c "import nzthermo, numpy as np; print(nzthermo.__version__, nzthermo.OPENMP_ENABLED)"
